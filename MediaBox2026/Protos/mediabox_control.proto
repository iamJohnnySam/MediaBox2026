syntax = "proto3";
option csharp_namespace = "MediaBox.Control.Grpc";
package mediabox.control;

service MediaBoxControl {
  // Triggers (run a unit of work once)
  rpc Scan(Empty) returns (RunResult);
  rpc Organize(Empty) returns (RunResult);
  rpc RssCheck(Empty) returns (RunResult);
  rpc TransmissionPoll(Empty) returns (RunResult);
  rpc YouTubeDownload(Empty) returns (RunResult);
  rpc YouTubePause(TitleArg) returns (RunResult);
  rpc YouTubeResume(TitleArg) returns (RunResult);
  rpc ResetQuality(Empty) returns (RunResult);
  rpc ToggleSpeedMode(Empty) returns (RunResult);
  rpc WatchlistCheck(Empty) returns (RunResult);
  // Queries
  rpc GetStatus(Empty) returns (Status);
  rpc GetDownloads(Empty) returns (DownloadList);
  rpc GetLibrary(LibraryQuery) returns (MediaList);
  rpc GetWatchlist(Empty) returns (WatchlistItems);
  rpc GetYouTubeSources(Empty) returns (YouTubeSources);
  rpc GetSettings(Empty) returns (SettingsMap);
  rpc GetShowEpisodes(ShowQuery) returns (EpisodeGuide);
  rpc SearchEpisodeTorrents(EpisodeTorrentQuery) returns (TorrentOptions);
  // Mutations
  rpc AddWatchlist(TitleArg) returns (RunResult);
  rpc RemoveWatchlist(TitleArg) returns (RunResult);
  rpc SearchMovies(TitleArg) returns (MovieOptions);
  rpc SearchAndAddMovie(TitleArg) returns (RunResult);
  rpc UpdateSettings(SettingsMap) returns (RunResult);
  rpc AddEpisodeTorrent(AddEpisodeTorrentArg) returns (RunResult);
  // Per-torrent controls for Tower's downloads page. Keyed by the sha1 hash, never by the
  // session id, which Transmission renumbers across its own restarts.
  rpc PauseTorrent(TorrentRef) returns (RunResult);
  rpc ResumeTorrent(TorrentRef) returns (RunResult);
  rpc SetEpisodeIgnored(EpisodeIgnoreArg) returns (RunResult);
  rpc SetSeasonIgnored(SeasonIgnoreArg) returns (RunResult);
}

message Empty {}
// imdb_code picks one specific search result (SearchMovies -> user picks -> SearchAndAddMovie);
// empty keeps the old behaviour of taking the top-rated hit.
message TitleArg { string title = 1; string imdb_code = 2; }
message LibraryQuery { string type = 1; }  // "tv" | "movies"
message RunResult { bool ok = 1; string message = 2; }
message Status { int32 tv_shows = 1; int32 movies = 2; int32 active_downloads = 3; bool speed_mode = 4; string summary = 5; }
message DownloadItem { string name = 1; double percent = 2; string status = 3; int64 size_bytes = 4; double rate_down = 5; string hash = 6; bool paused = 7; }
message TorrentRef { string hash = 1; }
message DownloadList { repeated DownloadItem items = 1; }
message MediaItem { string name = 1; string year = 2; int32 seasons = 3; string path = 4; }
message MediaList { repeated MediaItem items = 1; }
message WatchlistItem { string name = 1; string status = 2; string quality = 3; }
message WatchlistItems { repeated WatchlistItem items = 1; }
message MovieOption { string title = 1; int32 year = 2; string imdb_code = 3; string poster_url = 4; double rating = 5; }
message MovieOptions { repeated MovieOption items = 1; string error = 2; }
message YouTubeSource { string title = 1; string url = 2; bool paused = 3; }
message YouTubeSources { repeated YouTubeSource items = 1; }
message SettingsMap { map<string,string> values = 1; }

// Episode guide: aired episodes (TVmaze) diffed against what's on disk.
message ShowQuery { string path = 1; string name = 2; }  // path identifies exactly; name is the fallback + search term
message EpisodeEntry {
  int32 season = 1;
  int32 episode = 2;
  string title = 3;
  string air_date = 4;
  bool aired = 5;   // false = not out yet, which is NOT the same as missing
  bool have = 6;    // on disk
  bool dispatched = 7;  // tombstoned in DispatchedEpisodes: already downloading, or deliberately deleted
}
message EpisodeGuide {
  string show = 1;       // the library folder name (what the user clicked)
  string imdb_id = 2;    // digits only, no "tt" — needed for the torrent search
  string premiered = 3;
  repeated EpisodeEntry items = 4;
  string error = 5;      // non-empty = lookup failed, items is empty
}

// Per-episode torrent search.
message EpisodeTorrentQuery { string imdb_id = 1; int32 season = 2; int32 episode = 3; }
message TorrentOption {
  string title = 1;
  string quality = 2;         // "720p" / "1080p" / "unknown"
  int32 seeds = 3;
  int32 peers = 4;
  int64 size_bytes = 5;
  string magnet = 6;
  bool season_pack = 7;       // whole-season release containing the episode
  bool meets_standard = 8;    // within MediaBox's <=720p quality rule
}
message TorrentOptions { repeated TorrentOption items = 1; string error = 2; }
message AddEpisodeTorrentArg { string magnet = 1; string show = 2; int32 season = 3; int32 episode = 4; }
// Manual tombstone: ignored=true stops the RSS monitor ever fetching this episode; false lifts it.
message EpisodeIgnoreArg { string show = 1; int32 season = 2; int32 episode = 3; bool ignored = 4; }
// Same, for a whole season. path/name identify the show the way ShowQuery does, because
// ignoring a season means tombstoning every episode of it that isn't already on disk.
message SeasonIgnoreArg { string path = 1; string name = 2; int32 season = 3; bool ignored = 4; }
